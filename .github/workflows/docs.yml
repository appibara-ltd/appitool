name: Docs

on:
  # Publish docs only after a release succeeds, so the site never documents unreleased CLI behavior.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # Manual run for doc-only fixes between releases.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress
    # Skip when the triggering Release run failed or was cancelled.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Build from the exact released (tagged) commit; falls back to the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # full history for lastUpdated timestamps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Docs
        run: bun run docs:build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
