name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.0
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.0"

      - name: Build and Package (Apple Silicon arm64)
        run: |
          swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx13.0
          BIN_PATH="$(swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx13.0 --show-bin-path)/appitool"
          strip -rSTx "$BIN_PATH"
          codesign --force --sign - "$BIN_PATH"

          # Create tar.gz archive
          tar -czf appitool-darwin-arm64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-darwin-arm64
          path: appitool-darwin-arm64.tar.gz
          retention-days: 1

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.0
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.0"

      - name: Build and Package (Linux x86_64)
        run: |
          swift build -c release
          BIN_PATH="$(swift build -c release --show-bin-path)/appitool"
          strip -s "$BIN_PATH"

          # Create tar.gz archive
          tar -czf appitool-linux-x86_64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-linux-x86_64
          path: appitool-linux-x86_64.tar.gz
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate Checksums
        run: |
          sha256sum appitool-darwin-arm64.tar.gz appitool-linux-x86_64.tar.gz > checksums.txt

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: 'appitool-*.tar.gz'

      - name: Install appitool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            appitool-darwin-arm64.tar.gz \
            appitool-linux-x86_64.tar.gz \
            checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Send KokoNo Release Notification
        env:
          KOKONO_URL: ${{ secrets.KOKONO_URL }}
          KOKONO_E2E_PUBLIC_KEY: ${{ secrets.KOKONO_E2E_PUBLIC_KEY }}
        run: |
          if [ -z "$KOKONO_URL" ]; then
            echo "KOKONO_URL is not set, skipping notification."
            exit 0
          fi
          appitool kokono -t "appitool" -m "🚀 appitool ${{ github.ref_name }} has been released!"



