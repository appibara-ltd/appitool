name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4"

      - name: Build and Package (Apple Silicon arm64)
        run: |
          swift build -c release --arch arm64
          BIN_PATH="$(swift build -c release --arch arm64 --show-bin-path)/appitool"
          strip "$BIN_PATH"
          codesign --force --sign - "$BIN_PATH"

          # Create tar.gz archive
          tar -czf appitool-darwin-arm64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

          # Generate SHA256 checksum
          shasum -a 256 appitool-darwin-arm64.tar.gz > checksums.txt

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: 'appitool-darwin-arm64.tar.gz'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            appitool-darwin-arm64.tar.gz \
            checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes
