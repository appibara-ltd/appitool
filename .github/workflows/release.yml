name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Release gate, step 1: reuse the Tests run that the push to main already started for this commit
  # (waiting for it if it is still running) instead of testing the same commit twice.
  # Success → builds start. Failure → release stops. No usable run → the `test` job runs the tests here.
  check-tests:
    name: Check Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    outputs:
      run-tests: ${{ steps.check.outputs.run-tests }}
    steps:
      - name: Find Tests Run for This Commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          find_run() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch main --event push \
              --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion \
              --jq '.[0] | select(.) | "\(.databaseId) \(.status) \(.conclusion)"'
          }

          # The main push run can appear a few seconds after the tag push started this workflow.
          RUN=""
          for _ in 1 2 3 4 5 6; do
            RUN="$(find_run)"
            [ -n "$RUN" ] && break
            sleep 10
          done

          if [ -z "$RUN" ]; then
            echo "No Tests run on main for $GITHUB_SHA; tests will run in this workflow."
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read -r RUN_ID STATUS CONCLUSION <<< "$RUN"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          echo "Found Tests run: $RUN_URL ($STATUS)"

          if [ "$STATUS" != "completed" ]; then
            echo "Waiting for it to finish..."
            gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --interval 15 > /dev/null
            CONCLUSION="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          fi

          case "$CONCLUSION" in
            success)
              echo "Tests passed on main for $GITHUB_SHA; skipping the duplicate run."
              echo "run-tests=false" >> "$GITHUB_OUTPUT"
              ;;
            failure)
              echo "::error::Tests failed on main for $GITHUB_SHA: $RUN_URL"
              exit 1
              ;;
            *)
              # e.g. cancelled because a newer commit was pushed to main.
              echo "Tests run ended as '$CONCLUSION'; tests will run in this workflow."
              echo "run-tests=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # Release gate, step 2 (fallback): runs the shared test workflow (tests + Codecov upload).
  test:
    name: Tests
    needs: check-tests
    if: needs.check-tests.outputs.run-tests == 'true'
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build-macos:
    name: Build macOS (arm64)
    needs: [check-tests, test]
    if: ${{ !cancelled() && needs.check-tests.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.3
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.3"

      - name: Build and Package (Apple Silicon arm64)
        run: |
          swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx26.0
          BIN_PATH="$(swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx26.0 --show-bin-path)/appitool"
          strip -rSTx "$BIN_PATH"
          codesign --force --sign - "$BIN_PATH"

          # Create tar.gz archive
          GZIP=-9 tar -czf appitool-darwin-arm64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-darwin-arm64
          path: appitool-darwin-arm64.tar.gz
          retention-days: 1

  build-linux:
    name: Build Linux (x86_64)
    needs: [check-tests, test]
    if: ${{ !cancelled() && needs.check-tests.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.3
        run: |
          sudo apt-get update && sudo apt-get install -y binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev
          curl -fsSL https://download.swift.org/swift-6.4.3-release/ubuntu2404/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE-ubuntu24.04.tar.gz -o swift.tar.gz
          sudo mkdir -p /opt/swift-6.4.3
          sudo tar -xzf swift.tar.gz -C /opt/swift-6.4.3 --strip-components=1
          rm -f swift.tar.gz
          echo "/opt/swift-6.4.3/usr/bin" >> "$GITHUB_PATH"

      - name: Install Static Linux SDK
        run: |
          curl -fsSL https://download.swift.org/swift-6.4.3-release/static-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz -o static-linux-sdk.artifactbundle.tar.gz
          echo "529e6982974de78793c8348c1459105a772f54b464a51edf074e5b9c4bfe7c73  static-linux-sdk.artifactbundle.tar.gz" | sha256sum -c -
          swift sdk install static-linux-sdk.artifactbundle.tar.gz
          rm -f static-linux-sdk.artifactbundle.tar.gz

      - name: Build and Package (Linux x86_64)
        run: |
          swift package resolve
          chmod -R u+w .build/checkouts/PathKit .build/checkouts/XcodeProj
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/PathKit/Sources/PathKit.swift
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift
          sed -i '1i import Musl' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift

          swift build -c release --swift-sdk x86_64-swift-linux-musl
          BIN_PATH="$(swift build -c release --swift-sdk x86_64-swift-linux-musl --show-bin-path)/appitool"
          strip -s "$BIN_PATH"

          # Create tar.gz archive
          GZIP=-9 tar -czf appitool-linux-x86_64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-linux-x86_64
          path: appitool-linux-x86_64.tar.gz
          retention-days: 1

  build-linux-arm64:
    name: Build Linux (arm64)
    needs: [check-tests, test]
    if: ${{ !cancelled() && needs.check-tests.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.3
        run: |
          sudo apt-get update && sudo apt-get install -y binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev
          curl -fsSL https://download.swift.org/swift-6.4.3-release/ubuntu2404-aarch64/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE-ubuntu24.04-aarch64.tar.gz -o swift.tar.gz
          sudo mkdir -p /opt/swift-6.4.3
          sudo tar -xzf swift.tar.gz -C /opt/swift-6.4.3 --strip-components=1
          rm -f swift.tar.gz
          echo "/opt/swift-6.4.3/usr/bin" >> "$GITHUB_PATH"

      - name: Install Static Linux SDK
        run: |
          curl -fsSL https://download.swift.org/swift-6.4.3-release/static-sdk/swift-6.4.3-RELEASE/swift-6.4.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz -o static-linux-sdk.artifactbundle.tar.gz
          echo "529e6982974de78793c8348c1459105a772f54b464a51edf074e5b9c4bfe7c73  static-linux-sdk.artifactbundle.tar.gz" | sha256sum -c -
          swift sdk install static-linux-sdk.artifactbundle.tar.gz
          rm -f static-linux-sdk.artifactbundle.tar.gz

      - name: Build and Package (Linux arm64)
        run: |
          swift package resolve
          chmod -R u+w .build/checkouts/PathKit .build/checkouts/XcodeProj
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/PathKit/Sources/PathKit.swift
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift
          sed -i '1i import Musl' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift

          swift build -c release --swift-sdk aarch64-swift-linux-musl
          BIN_PATH="$(swift build -c release --swift-sdk aarch64-swift-linux-musl --show-bin-path)/appitool"
          strip -s "$BIN_PATH"

          # Create tar.gz archive
          GZIP=-9 tar -czf appitool-linux-arm64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-linux-arm64
          path: appitool-linux-arm64.tar.gz
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-linux-arm64]
    # Explicit condition: the skipped `test` job would otherwise skip this job too.
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && needs.build-linux.result == 'success' && needs.build-linux-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate Checksums
        run: |
          sha256sum appitool-darwin-arm64.tar.gz appitool-linux-x86_64.tar.gz appitool-linux-arm64.tar.gz > checksums.txt

      # Required: `self-update` and `appitool verify` always verify this attestation (sigstore-swift,
      # cross-checked with `gh` when installed), and install.sh verifies it with `gh` when installed,
      # so a release must never be published without one.
      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'appitool-*.tar.gz'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            appitool-darwin-arm64.tar.gz \
            appitool-linux-x86_64.tar.gz \
            appitool-linux-arm64.tar.gz \
            checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Install appitool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Send KokoNo Release Notification
        env:
          KOKONO_URL: ${{ secrets.KOKONO_URL }}
          KOKONO_E2E_PUBLIC_KEY: ${{ secrets.KOKONO_E2E_PUBLIC_KEY }}
        run: |
          if [ -z "$KOKONO_URL" ]; then
            echo "KOKONO_URL is not set, skipping notification."
            exit 0
          fi
          appitool kokono --title "appitool" --message "🚀 appitool ${{ github.ref_name }} has been released!"
