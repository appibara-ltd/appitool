name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.0
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.0"

      - name: Build and Package (Apple Silicon arm64)
        run: |
          swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx13.0
          BIN_PATH="$(swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx13.0 --show-bin-path)/appitool"
          strip -rSTx "$BIN_PATH"
          codesign --force --sign - "$BIN_PATH"

          # Create tar.gz archive
          GZIP=-9 tar -czf appitool-darwin-arm64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-darwin-arm64
          path: appitool-darwin-arm64.tar.gz
          retention-days: 1

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.0
        run: |
          sudo apt-get update && sudo apt-get install -y binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev
          curl -fsSL https://download.swift.org/swift-6.4.0-release/ubuntu2404/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-ubuntu24.04.tar.gz -o swift.tar.gz
          sudo mkdir -p /opt/swift-6.4.0
          sudo tar -xzf swift.tar.gz -C /opt/swift-6.4.0 --strip-components=1
          rm -f swift.tar.gz
          echo "/opt/swift-6.4.0/usr/bin" >> "$GITHUB_PATH"

      - name: Install Static Linux SDK
        run: |
          curl -fsSL https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz -o static-linux-sdk.artifactbundle.tar.gz
          echo "47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e  static-linux-sdk.artifactbundle.tar.gz" | sha256sum -c -
          swift sdk install static-linux-sdk.artifactbundle.tar.gz
          rm -f static-linux-sdk.artifactbundle.tar.gz

      - name: Build and Package (Linux x86_64)
        run: |
          swift package resolve
          chmod -R u+w .build/checkouts/PathKit .build/checkouts/XcodeProj
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/PathKit/Sources/PathKit.swift
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift
          sed -i '1i import Musl' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift

          swift build -c release --swift-sdk x86_64-swift-linux-musl
          BIN_PATH="$(swift build -c release --swift-sdk x86_64-swift-linux-musl --show-bin-path)/appitool"
          strip -s "$BIN_PATH"

          # Create tar.gz archive
          GZIP=-9 tar -czf appitool-linux-x86_64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-linux-x86_64
          path: appitool-linux-x86_64.tar.gz
          retention-days: 1

  build-linux-arm64:
    name: Build Linux (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Swift 6.4.0
        run: |
          sudo apt-get update && sudo apt-get install -y binutils libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev
          curl -fsSL https://download.swift.org/swift-6.4.0-release/ubuntu2404-aarch64/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-ubuntu24.04-aarch64.tar.gz -o swift.tar.gz
          sudo mkdir -p /opt/swift-6.4.0
          sudo tar -xzf swift.tar.gz -C /opt/swift-6.4.0 --strip-components=1
          rm -f swift.tar.gz
          echo "/opt/swift-6.4.0/usr/bin" >> "$GITHUB_PATH"

      - name: Install Static Linux SDK
        run: |
          curl -fsSL https://download.swift.org/swift-6.4.0-release/static-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz -o static-linux-sdk.artifactbundle.tar.gz
          echo "47d2fd89eebfdf9eb4d536b6710414297f755c17926cdebc4742c08982b40a9e  static-linux-sdk.artifactbundle.tar.gz" | sha256sum -c -
          swift sdk install static-linux-sdk.artifactbundle.tar.gz
          rm -f static-linux-sdk.artifactbundle.tar.gz

      - name: Build and Package (Linux arm64)
        run: |
          swift package resolve
          chmod -R u+w .build/checkouts/PathKit .build/checkouts/XcodeProj
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/PathKit/Sources/PathKit.swift
          sed -i 's/Glibc/Musl/g; s/GLOB_BRACE/0/g' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift
          sed -i '1i import Musl' .build/checkouts/XcodeProj/Sources/XcodeProj/Extensions/Path+Extras.swift

          swift build -c release --swift-sdk aarch64-swift-linux-musl
          BIN_PATH="$(swift build -c release --swift-sdk aarch64-swift-linux-musl --show-bin-path)/appitool"
          strip -s "$BIN_PATH"

          # Create tar.gz archive
          GZIP=-9 tar -czf appitool-linux-arm64.tar.gz -C "$(dirname "$BIN_PATH")" appitool

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: appitool-linux-arm64
          path: appitool-linux-arm64.tar.gz
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-linux, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate Checksums
        run: |
          sha256sum appitool-darwin-arm64.tar.gz appitool-linux-x86_64.tar.gz appitool-linux-arm64.tar.gz > checksums.txt

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: 'appitool-*.tar.gz'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            appitool-darwin-arm64.tar.gz \
            appitool-linux-x86_64.tar.gz \
            appitool-linux-arm64.tar.gz \
            checksums.txt \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Install appitool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./install.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Send KokoNo Release Notification
        env:
          KOKONO_URL: ${{ secrets.KOKONO_URL }}
          KOKONO_E2E_PUBLIC_KEY: ${{ secrets.KOKONO_E2E_PUBLIC_KEY }}
        run: |
          if [ -z "$KOKONO_URL" ]; then
            echo "KOKONO_URL is not set, skipping notification."
            exit 0
          fi
          appitool kokono -t "appitool" -m "🚀 appitool ${{ github.ref_name }} has been released!"




