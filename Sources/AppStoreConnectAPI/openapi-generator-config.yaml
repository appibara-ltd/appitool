generate:
  - types
  - client
accessModifier: package
filter:
  paths:
    - /v1/apps
    - /v1/builds
    - /v1/certificates
    - /v1/certificates/{id}
    - /v1/bundleIds
    - /v1/bundleIds/{id}
    - /v1/profiles
    - /v1/profiles/{id}
    - /v1/devices
    - /v1/devices/{id}
    - /v1/bundleIdCapabilities
    - /v1/bundleIds/{id}/bundleIdCapabilities
    - /v1/buildUploads
    - /v1/buildUploads/{id}
    - /v1/buildUploadFiles
    - /v1/buildUploadFiles/{id}
    - /v1/betaBuildLocalizations
    - /v1/betaBuildLocalizations/{id}
    - /v1/builds/{id}/betaBuildLocalizations
    - /v1/users
    - /v1/users/{id}
    - /v1/userInvitations
    - /v1/userInvitations/{id}
    - /v1/apps/{id}/appStoreVersions
    - /v1/appStoreVersions
    - /v1/appStoreVersions/{id}
    - /v1/appStoreVersions/{id}/appStoreReviewDetail
    - /v1/appStoreReviewDetails
    - /v1/appStoreReviewDetails/{id}
    - /v1/apps/{id}
    - /v1/appInfos/{id}
    - /v1/appCategories
    - /v1/appStoreVersions/{id}/appStoreVersionLocalizations
    - /v1/appStoreVersionLocalizations/{id}
    - /v1/apps/{id}/appInfos
    - /v1/appInfos/{id}/appInfoLocalizations
    - /v1/appInfoLocalizations/{id}
    - /v1/apps/{id}/assetLibrary
    - /v1/appAssetLibraryImages
    - /v1/appAssetLibraryImages/{id}
    - /v1/appAssetLibraryPlacements
    - /v1/appAssetLibraryPlacements/{id}
    - /v1/appAssetLibraryPlacementOrderingRequests
    - /v1/appStoreVersionLocalizations/{id}/placements
    - /v1/appAssetLibraryRefData
  # Not referenced by any generated path; kept for screenshot display type parsing (AppleTypeMapper).
  schemas:
    - ScreenshotDisplayType
