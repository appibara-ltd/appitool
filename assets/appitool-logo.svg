<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#071526" />
      <stop offset="100%" stop-color="#030508" />
    </radialGradient>

    <!-- Electric Blue to Vibrant Cyan Gradients -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <linearGradient id="frameGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="60%" stop-color="#4361EE" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="chevronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070F3" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Canvas -->
  <rect width="800" height="800" fill="url(#bgGlow)" rx="48" />

  <!-- Main Symbol Group -->
  <g transform="translate(160, 110)">
    <!-- Mobile App Container Frame (outer squircle) -->
    <rect x="0" y="0" width="480" height="480" rx="108" ry="108"
          fill="none"
          stroke="url(#frameGradient)"
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- Subdued Grid Tech Accent -->
    <path d="M 0 360 H 480 M 120 0 V 480" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.08" />

    <!-- Stylized Capybara Head & Profile Geometric Silhouette -->
    <!-- Ear, Forehead, Rounded Snout, Jawline -->
    <path d="M 200 135
             C 192 110, 222 96, 235 118
             L 255 135
             L 330 135
             C 380 135, 400 165, 400 205
             C 400 230, 395 242, 375 252
             L 320 252
             C 290 252, 275 272, 275 305
             L 275 370"
          fill="none"
          stroke="url(#primaryGradient)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Capybara Nostril / Mouth detail (minimalist tech notch) -->
    <path d="M 375 210 L 355 210"
          stroke="#00F5D4"
          stroke-width="18"
          stroke-linecap="round" />

    <!-- Capybara Eye (Precision terminal dot / circle) -->
    <circle cx="310" cy="182" r="13" fill="#00F5D4" />

    <!-- Terminal Command Chevron ('>') fused into the chest / lower contour -->
    <path d="M 120 230
             L 210 295
             L 120 360"
          fill="none"
          stroke="url(#chevronGradient)"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#glow)" />

    <!-- CLI Cursor Prompt line beneath chevron -->
    <line x1="210" y1="360" x2="250" y2="360"
          stroke="#00F5D4"
          stroke-width="24"
          stroke-linecap="round" />
  </g>

  <!-- Typography: appitool -->
  <g text-anchor="middle">
    <text x="400" y="675"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif"
          font-size="62"
          font-weight="800"
          letter-spacing="2"
          fill="url(#textGradient)">
      appitool
    </text>

    <!-- Subtitle: UNIFIED DEVELOPER CLI -->
    <text x="400" y="718"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Mono', 'Fira Code', 'Roboto Mono', monospace"
          font-size="19"
          font-weight="600"
          letter-spacing="9"
          fill="#38BDF8"
          fill-opacity="0.88">
      UNIFIED DEVELOPER CLI
    </text>
  </g>
</svg>
