[tasks.build]
run = 'swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx13.0 && BIN_PATH="$(swift build -c release -Xswiftc -target -Xswiftc arm64-apple-macosx13.0 --show-bin-path)/appitool" && strip "$BIN_PATH"'

[tasks.release]
run = 'VERSION=$(sed -n "s/.*version: \"\([^\"]*\)\".*/\1/p" Sources/appitool/appitool.swift) && git push && git tag "v$VERSION" && git push origin "v$VERSION"'

